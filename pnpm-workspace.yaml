allowBuilds:
  esbuild: true
  workerd: true
blockExoticSubdeps: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
overrides:
  # GHSA-rgj7-g3m4-5g8c; remove when Miniflare pins sharp >=0.35.4.
  miniflare>sharp: 0.35.4
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
saveExact: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy transitive release without the trust evidence of an older release.
  - semver@6.3.1
update:
  # Must match the Vitest version bundled by vite-plus exactly.
  ignoreDeps:
    - "@vitest/coverage-v8"
