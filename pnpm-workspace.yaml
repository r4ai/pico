allowBuilds:
  esbuild: true
  workerd: true
blockExoticSubdeps: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
overrides:
  # GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr; remove when Oxfmt pins tinypool >=2.1.2.
  oxfmt>tinypool: 2.1.2
  # GHSA-rgj7-g3m4-5g8c and GHSA-wq5f-xc86-pv6w; remove when Miniflare pins sharp >=0.35.5.
  miniflare>sharp: 0.35.5
  # GHSA-3wwx-pv8p-q78v; remove when Miniflare pins undici >=7.29.1.
  miniflare>undici: 7.29.1
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
saveExact: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy transitive release without the trust evidence of an older release.
  - semver@6.3.1
update:
  # Must match the Vitest version bundled by vite-plus exactly.
  ignoreDeps:
    - "@vitest/coverage-v8"
