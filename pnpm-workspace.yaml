allowBuilds:
  esbuild: true
  workerd: true
blockExoticSubdeps: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
overrides:
  # GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr; remove when Oxfmt pins tinypool >=2.1.2.
  oxfmt>tinypool: 2.1.2
  # GHSA-rgj7-g3m4-5g8c and GHSA-wq5f-xc86-pv6w; remove when Miniflare pins sharp >=0.35.5.
  miniflare>sharp: 0.35.5
  # GHSA-3wwx-pv8p-q78v, GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, and GHSA-f72v-6w45-q472;
  # remove when Miniflare pins undici >=7.30.1.
  miniflare>undici: 7.30.1
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
saveExact: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy transitive release without the trust evidence of an older release.
  - semver@6.3.1
update:
  # Must match the Vitest version bundled by vite-plus exactly.
  ignoreDeps:
    - "@vitest/coverage-v8"
