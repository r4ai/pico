name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Actions pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          install_args: pinact

      - run: pinact run --check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run security:audit

  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # vp check is format, lint and type-check in one pass.
          - name: Check
            script: check
          - name: Test
            script: test
          - name: Build
            script: build
          - name: Storybook
            script: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          install_args: node pnpm

      - name: Get pnpm store directory
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --frozen-lockfile fails rather than resolving anything the lockfile does not pin.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.script }}

  preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [actions, dependency-review, audit, verify]
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview/pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - name: Upload preview
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          wranglerVersion: 4.125.0

      - name: Smoke test preview
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for path in / /deployment-smoke '?code=hello'; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors "${BASE_URL}${path}" \
              | grep --fixed-strings '<title>Pico — Picture + Code</title>'
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors --head \
            "${BASE_URL}/favicon-32x32.png" | grep --ignore-case --fixed-strings 'content-type: image/png'

  production:
    name: Deploy production
    if: github.event_name == 'push'
    needs: [actions, audit, verify]
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://pico.r4ai.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - name: Deploy production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          wranglerVersion: 4.125.0

      - name: Smoke test production
        env:
          BASE_URL: https://pico.r4ai.dev
        run: |
          for path in / /deployment-smoke '?code=hello'; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors "${BASE_URL}${path}" \
              | grep --fixed-strings '<title>Pico — Picture + Code</title>'
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors --head \
            "${BASE_URL}/favicon-32x32.png" | grep --ignore-case --fixed-strings 'content-type: image/png'
